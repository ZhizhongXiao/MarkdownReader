<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE}}</title>
    <style>
{{STYLE}}
    </style>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div class="identity">
                <span class="folder-icon" aria-hidden="true"></span>
                <div>
                    <h1>{{HEADING}}</h1>
                    <p class="count">共 {{COUNT}} 份文档</p>
                </div>
            </div>
            <input
                class="search"
                id="document-search"
                type="search"
                placeholder="搜索文档标题"
                autocomplete="off"
            >
        </header>
        <section class="index-body" id="index-body">
            {{ITEMS}}
            <p class="no-results" id="no-results" hidden>没有匹配的文档</p>
        </section>
    </main>
    <script>
{{SCRIPT}}
    </script>
</body>
</html>
