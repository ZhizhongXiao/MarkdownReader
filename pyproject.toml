[project]
name = "markdownreader"
version = "1.0.0rc1"
description = "Markdown 到自包含 HTML 的本地转换与阅读工具"
# A release is built with one interpreter line: a build must not silently
# happen on a newer Python than the one the release was validated with.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 打包 EXE 时才需要；最终用户不安装 Python，也感知不到这些依赖
build = [
    "pyinstaller>=6.0",
    # The splash screen build needs it; leaving it undeclared meant a build
    # depended on whatever the developer happened to have installed.
    "pillow>=10.0",
]
# 开发与验证需要
test = ["pytest>=8.0"]
lint = ["ruff>=0.6", "black>=24.0"]

[tool.uv]
# 这是一个应用仓库，不是可安装的库
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
# upstream/ 是第三方源码（submodule）：不改它，也不用我们的 lint 规则检查它。
exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]